name: Build and Release

on:
  push:
    tags:
      - 'v*'      # v0.1.0, v1.0.0 등
      - '[0-9]*'  # 0.0.1 (v 없는 태그도 지원)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        # v 접두사 제거 (v0.1.0 -> 0.1.0)
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Publish application
      run: |
        dotnet publish src/TanukiTarkovMap/TanukiTarkovMap.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o publish

    - name: Install Velopack
      run: dotnet tool install -g vpk

    # delta 패키지 생성을 위해 이전 릴리스를 내려받는다.
    # 이 단계가 없으면 매 릴리스가 full 패키지만 포함해 사용자가 전체를 다시 받는다.
    # 첫 릴리스처럼 이전 릴리스가 없으면 실패해도 계속 진행한다 (full만 배포됨)
    - name: Download previous release (for delta)
      continue-on-error: true
      run: |
        vpk download github `
          --repoUrl "https://github.com/siakun/TanukiTarkovMap" `
          --token "${{ secrets.GITHUB_TOKEN }}" `
          --outputDir "releases"

    # --framework: CefSharp.Core.Runtime.dll이 MSVCP140.dll, VCRUNTIME140.dll,
    #   VCRUNTIME140_1.dll을 import한다. 이 셋은 Windows에 기본 포함되지 않고 VC++
    #   재배포 패키지에만 들어 있어, 개발 도구가 없는 깨끗한 Windows에서는 앱이
    #   "지정된 모듈을 찾을 수 없습니다"로 죽는다. Setup.exe가 설치 전에 이를 먼저
    #   깔도록 선언해 둔다. 개발 PC에서는 이미 깔려 있어 증상이 안 보이므로 지우지 말 것.
    - name: Pack with Velopack
      run: |
        vpk pack `
          --packId "TanukiTarkovMap" `
          --packVersion "${{ steps.version.outputs.version }}" `
          --packDir "publish" `
          --mainExe "TanukiTarkovMap.exe" `
          --framework "vcredist143-x64" `
          --outputDir "releases"

    - name: Remove unnecessary files
      run: |
        Remove-Item -Path "releases/assets.win.json" -ErrorAction SilentlyContinue
        Remove-Item -Path "releases/RELEASES" -ErrorAction SilentlyContinue

        # delta 생성용으로 내려받은 이전 버전 패키지는 새 릴리스에 재업로드하지 않도록 제거
        $version = "${{ steps.version.outputs.version }}"
        Get-ChildItem -Path "releases" -Filter "*.nupkg" |
          Where-Object { $_.Name -notlike "*$version*" } |
          Remove-Item

    - name: Rename release files (MS style)
      run: |
        $version = "${{ steps.version.outputs.version }}"

        # Setup.exe 이름 변경
        $setupFile = Get-ChildItem -Path "releases" -Filter "*-Setup.exe" | Select-Object -First 1
        if ($setupFile) {
          Rename-Item -Path $setupFile.FullName -NewName "TanukiTarkovMap-Setup-$version-x64.exe"
        }

        # Portable.zip 이름 변경
        $portableFile = Get-ChildItem -Path "releases" -Filter "*-Portable.zip" | Select-Object -First 1
        if ($portableFile) {
          Rename-Item -Path $portableFile.FullName -NewName "TanukiTarkovMap-Portable-$version-x64.zip"
        }

    - name: List release files
      run: Get-ChildItem -Path releases

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        files: |
          releases/*.nupkg
          releases/releases.win.json
          releases/*-Setup-*.exe
          releases/*-Portable-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
